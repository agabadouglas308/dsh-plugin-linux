name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Plugin typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:plugin
      - name: Checked-in lib/ is up to date
        run: git diff --exit-code -- packages/extensions/plugin-linux-system/lib

  wrapper:
    name: Wrapper format, check, lint, test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libnotify-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-linux
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: apps/desktop-linux
        run: cargo fmt --check
      - working-directory: apps/desktop-linux
        run: cargo check --all-targets
      - working-directory: apps/desktop-linux
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: apps/desktop-linux
        run: cargo test
      - name: Installer test
        run: ./scripts/test-install-plugin.sh
