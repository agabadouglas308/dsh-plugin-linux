name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libnotify-dev \
            patchelf libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-linux
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build bundles
        run: |
          cd apps/desktop-linux
          cargo tauri build --bundles deb,rpm,appimage
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop-linux/target/release/bundle/deb/*.deb
            apps/desktop-linux/target/release/bundle/rpm/*.rpm
            apps/desktop-linux/target/release/bundle/appimage/*.AppImage
          generate_release_notes: true
