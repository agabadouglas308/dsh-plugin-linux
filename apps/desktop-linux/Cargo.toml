[workspace]

[package]
name = "dsh-desktop-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify-rust = "4"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time", "net", "signal", "sync"] }
regex = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

[[bin]]
name = "dsh-desktop-linux"
path = "src/main.rs"
